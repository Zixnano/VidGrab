<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { --bg:#0a0a0f; --panel:#12121a; --elev:#1a1a24; --sel:#173a41; --hover:#1a1a24;
          --bd:#242430; --bd-hi:#33333f; --tx:#e6e6eb; --tx-soft:#b3b3bd; --mu:#8a8a95; --dim:#5a5a65;
          --ac:#26c6da; --ac-dim:#1a8a99; --on-ac:#0a0a0f; --ok:#4caf50; --warn:#ffb300; --err:#ef5350;
          --info:#42a5f5; --r:10px; --font:-apple-system, "Segoe UI", Roboto, sans-serif; color-scheme:dark; }
  * { box-sizing: border-box; }
  body { width: 380px; font: 13px/1.4 var(--font); margin: 0; padding: 12px; color: var(--tx); background: var(--bg); }
  button { font: inherit; color: var(--tx); background: var(--elev); border: 1px solid var(--bd);
           border-radius: var(--r); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--bd-hi); background: var(--hover); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
  .hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .hdr img { width: 32px; height: 32px; border-radius: 8px; }
  .hdr b { display: block; font-size: 15px; }
  .hdr small { color: var(--mu); letter-spacing: .06em; font-size: 11px; }
  #status { font-size: 12px; margin-bottom: 10px; padding: 8px 12px; border-radius: var(--r); }
  .ok { background: color-mix(in srgb, var(--ok) 14%, var(--panel)); color: var(--ok); }
  .ok:before { content: "\25CF  "; font-size: 10px; }
  .bad { background: color-mix(in srgb, var(--err) 14%, var(--panel)); color: var(--err); }

  .tabs { display: flex; gap: 3px; margin-bottom: 8px; padding: 3px; background: var(--elev); border-radius: var(--r); }
  .tab { flex: 1; padding: 7px; font-size: 12px; border: 0; background: transparent; color: var(--mu); }
  .tab:hover:not(:disabled) { background: transparent; color: var(--tx); }
  .tab.active { background: var(--ac); color: var(--on-ac); font-weight: 600; }

  #otherTabs { margin-bottom: 6px; }
  .otab { display: flex; justify-content: space-between; padding: 6px 10px; border: 1px solid var(--bd);
          border-radius: var(--r); margin-bottom: 4px; cursor: pointer; font-size: 12px; background: var(--panel); }
  .otab:hover { background: var(--hover); }
  .otab.sel { border-color: var(--ac); background: var(--sel); }

  .mrow { display: flex; align-items: center; gap: 8px; border: 1px solid var(--bd); background: var(--panel);
          border-radius: var(--r); padding: 6px 9px; margin-bottom: 5px; }
  .mrow:hover { border-color: var(--bd-hi); }
  .mrow input[type=checkbox] { flex-shrink: 0; accent-color: var(--ac); }
  .mrow .mname { font-size: 12px; word-break: break-all; flex: 1; }
  .mrow .macts { flex-shrink: 0; white-space: nowrap; }
  .mrow .macts button { font-size: 12px; padding: 2px 7px; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 4px; }
  .toolbar button { flex: 1 1 auto; font-size: 11px; padding: 6px 8px; }
  .toolbar button:disabled { opacity: .4; cursor: default; }
  #btnDownload { background: var(--ac); color: var(--on-ac); border-color: var(--ac); font-weight: 600; }
  #btnDownload:hover:not(:disabled) { background: var(--ac-dim); border-color: var(--ac-dim); }

  #filterPanel { border: 1px solid var(--bd); background: var(--panel); border-radius: var(--r);
                 padding: 8px; margin-bottom: 8px; font-size: 12px; display: block; }
  #filterPanel label { position: relative; display: inline-block; margin: 0 4px 5px 0; padding: 3px 10px;
                       border: 1px solid var(--bd); border-radius: 999px; color: var(--mu); cursor: pointer; white-space: nowrap; }
  #filterPanel label input { position: absolute; opacity: 0; width: 0; height: 0; }
  #filterPanel label:has(input:checked) { border-color: var(--ac); color: var(--ac); background: var(--sel); }
  #filterPanel label:has(input:focus-visible) { outline: 2px solid var(--ac); outline-offset: 2px; }
  #filterPanel .tiny { display: block; margin: 6px 0 0; padding: 0; border: 0; border-radius: 0; background: none;
                       color: var(--mu); cursor: pointer; }
  #filterPanel .tiny input { position: static; opacity: 1; width: auto; height: auto; accent-color: var(--ac); vertical-align: -2px; }
  #searchInput { width: 100%; padding: 7px 10px; margin-bottom: 8px; border: 1px solid var(--bd);
                 border-radius: var(--r); font: inherit; display: none; background: var(--bg); color: var(--tx); }
  #searchInput:focus { border-color: var(--ac); outline: none; }

  .empty { color: var(--dim); font-size: 12px; padding: 14px 0; text-align: center; }
  #mediaStatus { font-size: 11px; color: var(--mu); min-height: 14px; margin-bottom: 4px; }

  .grab-item { display: flex; align-items: flex-start; gap: 7px; border: 1px solid var(--bd); background: var(--panel);
    border-radius: var(--r); padding: 6px 9px; margin-bottom: 5px; }
  .grab-item input[type=checkbox] { margin-top: 3px; flex-shrink: 0; accent-color: var(--ac); }
  .grab-item .name { font-size: 12px; word-break: break-all; }
  .grab-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .grab-toolbar button { font-size: 11px; padding: 4px 9px; }
  #grabAllBtn, #grabSendBtn { width: 100%; padding: 8px; }
  #grabSendBtn { margin-top: 6px; background: var(--ac); color: var(--on-ac); border-color: var(--ac); font-weight: 600; }
  #grabSendBtn:disabled { opacity: .5; cursor: default; }
  .divider { border-top: 1px solid var(--bd); margin: 12px 0 10px; }

  #recent { margin-bottom: 10px; }
  #recent h2 { font-size: 11px; font-weight: 600; color: var(--mu); margin: 0 0 5px; letter-spacing: .06em; }
  .rjob { border: 1px solid var(--bd); background: var(--panel); border-radius: var(--r); padding: 6px 9px; margin-bottom: 4px; font-size: 12px; }
  .rjob .rname { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rjob .rmeta { display: flex; justify-content: space-between; color: var(--mu); font-size: 11px; }
  .rjob .rbar { height: 4px; background: var(--elev); border-radius: 4px; margin: 4px 0; overflow: hidden; }
  .rjob .rbar > i { display: block; height: 100%; background: var(--ac); }
  .rjob.err .rmeta .rstat { color: var(--err); }
  #siteRow { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--mu); margin-bottom: 8px; }
  #siteToggle { font-size: 11px; padding: 3px 10px; }
</style>
</head>
<body>
  <div class="hdr"><img src="icons/icon48.png" alt=""><div><b>Video Grabber</b><small>BROWSER EXTENSION</small></div></div>
  <div id="status">Checking desktop app…</div>
  <div id="recent" style="display:none;"><h2>Recent downloads</h2><div id="recentList"></div></div>
  <div id="siteRow"><span id="siteName"></span><button id="siteToggle">Hide pill on this site</button></div>

  <div class="tabs">
    <button id="tabCurrent" class="tab active">Current Page</button>
    <button id="tabOther" class="tab">Other Pages</button>
  </div>
  <div id="otherTabs" style="display:none;"></div>
  <div id="searchInputWrap"><input id="searchInput" type="text" placeholder="Filter by name or URL…"/></div>
  <div id="filterPanel">
    <label><input type="checkbox" value="mp4" checked/> mp4</label>
    <label><input type="checkbox" value="webm" checked/> webm</label>
    <label><input type="checkbox" value="m3u8" checked/> m3u8</label>
    <label><input type="checkbox" value="mp3" checked/> mp3</label>
    <label><input type="checkbox" value="image"/> image</label>
    <label><input type="checkbox" value="doc"/> doc</label>
    <label><input type="checkbox" value="archive"/> archive</label>
    <label><input type="checkbox" value="programs"/> programs</label>
    <label><input type="checkbox" value="other"/> other</label>
    <label class="tiny"><input type="checkbox" id="hideTiny" checked/> Hide files under 100 KB</label>
  </div>
  <div id="mediaList"><div class="empty">Scanning this tab…</div></div>
  <div id="mediaStatus"></div>

  <div class="toolbar">
    <button id="btnMerge" disabled title="Download checked items, merging HLS streams">Merge</button>
    <button id="btnDownload" title="Download checked items">Download</button>
    <button id="btnCopy" title="Copy checked URLs">Copy</button>
    <button id="btnToggle" title="Check/uncheck all">Toggle</button>
    <button id="btnFilter" title="Filter by type">Filter</button>
    <button id="btnClear" title="Clear this tab's detected list">Clear</button>
    <button id="btnSearch" title="Search">Search</button>
  </div>

  <div class="divider"></div>
  <button id="grabAllBtn" style="margin-bottom:8px;">🔍 Grab all media/files on this page</button>
  <div id="grabResult" style="font-size:11px;color:#555;margin-bottom:8px;"></div>
  <div id="grabToolbar" class="grab-toolbar" style="display:none;">
    <span id="grabCount" style="font-size:11px;color:#555;"></span>
    <button id="grabToggleAll">Select none</button>
  </div>
  <div id="grabChecklist"></div>
  <button id="grabSendBtn" style="display:none;">Send selected to Grabber</button>

  <script src="theme.js"></script>
  <script src="popup.js"></script>
</body>
</html>
