name: Build VideoGrabber.exe

on:
  workflow_dispatch:      # manual "Run workflow" button on GitHub
  push:
    paths:
      - "backend/**"
      - ".github/workflows/build-exe.yml"

# Required so the release step can create a release in this repo.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Pinned instead of tracking releases/latest, for reproducible builds
      # (QUESTIONS.md #3 / BUGS.md #6). Bump this deliberately when you want
      # a newer Deno — e.g. for a YouTube signature-challenge fix — rather
      # than getting whatever's newest on an unrelated push.
      DENO_VERSION: "2.9.6"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and bundle ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted
          $ffmpegExe = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination .\ffmpeg.exe
          $ffprobeExe = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ffprobeExe.FullName -Destination .\ffprobe.exe

      - name: Download and bundle Deno
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/download/v${env:DENO_VERSION}/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
          Expand-Archive "deno.zip" -DestinationPath "_deno" -Force
          Copy-Item "_deno\deno.exe" "deno.exe"

      # Thin launcher: built from VideoGrabber.spec (onedir, console=False,
      # no PySide6 / yt-dlp / streamlink / watchdog / ffmpeg / Deno / app
      # code — those all live in runtime\). Output: dist-launcher\
      # VideoGrabber\ containing VideoGrabber.exe + VideoGrabber_internal\.
      - name: Build thin launcher exe
        run: pyinstaller VideoGrabber.spec --noconfirm --distpath dist-launcher --workpath build-launcher

      # Launcher must stay thin: numpy/PIL/PySide6 live ONLY in runtime\site-packages.
      - name: Verify launcher is thin
        shell: pwsh
        run: |
          $int = 'dist-launcher/VideoGrabber/VideoGrabber_internal'
          foreach ($n in 'numpy','numpy.libs','PIL','pillow.libs','PySide6','yt_dlp') {
            if (Test-Path "$int/$n") { throw "Launcher bundles $n; it must only live in runtime\site-packages" }
          }
          Write-Host "Launcher is thin: OK"

      # runtime\site-packages: the full dependency set as importable source.
      # --upgrade because a plain --target skips requirements already
      # satisfied in the CI python's own site-packages. PySide6 STAYS in
      # site-packages (it's a package, not a loose folder) — the launcher's
      # add_dll_directory points at runtime\site-packages\PySide6.
      - name: Install runtime dependencies
        run: pip install --upgrade -r requirements.txt --target "staging\video 3 grabber\runtime\site-packages"

      # Fail the build if numpy / Pillow (and numpy's DLL folder) did not land
      # in runtime\site-packages, then import them from THERE only
      # (-I -S ignores the CI python's own site-packages).
      - name: Verify numpy and Pillow in runtime
        shell: pwsh
        run: |
          $sp = (Resolve-Path 'staging/video 3 grabber/runtime/site-packages').Path
          foreach ($n in 'numpy','PIL') {
            if (-not (Test-Path "$sp/$n")) { throw "$n missing from runtime\site-packages" }
          }
          if (-not (Test-Path "$sp/numpy.libs")) { Write-Warning "numpy.libs not present (ok only if this numpy build has no vendored DLLs)" }
          @'
          import sys, os
          sp = sys.argv[1]
          sys.path.insert(0, sp)
          for d in (sp, os.path.join(sp, "numpy.libs"), os.path.join(sp, "pillow.libs")):
              if os.path.isdir(d):
                  os.add_dll_directory(d)
          import numpy, PIL
          from PIL import Image
          assert os.path.normcase(numpy.__file__).startswith(os.path.normcase(sp)), numpy.__file__
          assert os.path.normcase(PIL.__file__).startswith(os.path.normcase(sp)), PIL.__file__
          print("numpy", numpy.__version__, "| PIL", PIL.__version__, "| arr sum", int(numpy.arange(10).sum()))
          '@ | Set-Content -Path smoke_runtime.py -Encoding utf8
          python -I -S smoke_runtime.py "$sp"
          if ($LASTEXITCODE -ne 0) { throw "numpy/PIL import from runtime\site-packages failed" }

      - name: Assemble split layout (launcher + app + runtime)
        shell: pwsh
        run: |
          $root = 'staging/video 3 grabber'
          # app\ = my Python code only (every backend .py, launcher.py included)
          New-Item -ItemType Directory -Force "$root/app" | Out-Null
          Copy-Item -Path *.py -Destination "$root/app/"
          Copy-Item -Path updater.bat, restore.bat -Destination "$root/"
          # Stamp the setup with its own build tag so a fresh install
          # compares updates against THIS build, not APP_VERSION.
          Set-Content "$root/install-version.txt" "v${env:GITHUB_RUN_NUMBER}" -NoNewline
          # launcher = exe + its internal folder, both at the install root
          Copy-Item -Path 'dist-launcher/VideoGrabber/VideoGrabber.exe' -Destination "$root/VideoGrabber.exe"
          Copy-Item -Path 'dist-launcher/VideoGrabber/VideoGrabber_internal' -Destination "$root/" -Recurse
          # PySide6 is NOT hoisted — it remains runtime\site-packages\PySide6
          Copy-Item -Path ffmpeg.exe, ffprobe.exe, deno.exe -Destination "$root/runtime/"

      - name: "Package setup zip (full install: launcher + app + runtime)"
        shell: pwsh
        run: |
          Compress-Archive -Path 'staging/video 3 grabber' `
            -DestinationPath "VideoGrabber-setup-v${env:GITHUB_RUN_NUMBER}.zip" -Force

      # Thin update zip: launcher (exe + internal) + app ONLY. Must NOT
      # contain runtime\ — if it does, the split is pointless and updates
      # stay ~148 MB.
      - name: Package app-only update zip
        shell: pwsh
        run: |
          $appRoot = 'staging-app/video 3 grabber'
          New-Item -ItemType Directory -Force "$appRoot/app" | Out-Null
          Copy-Item -Path *.py -Destination "$appRoot/app/"
          Copy-Item -Path 'dist-launcher/VideoGrabber/VideoGrabber.exe' -Destination "$appRoot/VideoGrabber.exe"
          Copy-Item -Path 'dist-launcher/VideoGrabber/VideoGrabber_internal' -Destination "$appRoot/" -Recurse
          Compress-Archive -Path "$appRoot" `
            -DestinationPath "VideoGrabber-app-v${env:GITHUB_RUN_NUMBER}.zip" -Force

      # softprops/action-gh-release: files: paths are relative to the
      # WORKSPACE ROOT, not the backend working-directory — hence the
      # backend/ prefix on both zips. Releases don't count against the
      # Actions artifact storage quota; each build becomes a permanent
      # release tagged vN with both zips attached.
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Build ${{ github.run_number }}"
          body: |
            Automatic build from commit ${{ github.sha }}.

            ${{ github.event.head_commit.message }}

            - `VideoGrabber-setup-v${{ github.run_number }}.zip` — full install (launcher + app + runtime)
            - `VideoGrabber-app-v${{ github.run_number }}.zip` — thin update (launcher + app only, no runtime)
          files: |
            backend/VideoGrabber-setup-v${{ github.run_number }}.zip
            backend/VideoGrabber-app-v${{ github.run_number }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
