name: Build VideoGrabber.exe

on:
  workflow_dispatch:      # manual "Run workflow" button on GitHub
  push:
    paths:
      - "backend/**"
      - ".github/workflows/build-exe.yml"

# Required so the release step can create a release in this repo.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DENO_VERSION: "2.9.6"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and bundle ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted
          $ffmpegExe = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination .\ffmpeg.exe
          $ffprobeExe = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ffprobeExe.FullName -Destination .\ffprobe.exe

      - name: Download and bundle Deno
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/download/v${env:DENO_VERSION}/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
          Expand-Archive "deno.zip" -DestinationPath "_deno" -Force
          Copy-Item "_deno\deno.exe" "deno.exe"

      - name: Build supervisor exe
        run: pyinstaller VideoGrabber.spec --noconfirm --distpath dist-supervisor --workpath build-supervisor

      - name: Build app host exe
        run: pyinstaller AppHost.spec --noconfirm --distpath dist-host --workpath build-host

      - name: Build recovery exe (onedir, bundles PySide6)
        run: pyinstaller Recovery.spec --noconfirm --distpath dist-recovery --workpath build-recovery

      - name: Assert PyInstaller internal folders exist
        shell: pwsh
        run: |
          foreach ($d in 'dist-supervisor/VideoGrabber/VideoGrabber_internal','dist-host/VideoGrabberApp/VideoGrabberApp_internal','dist-recovery/recovery/VideoGrabberRecovery_internal') {
            if (-not (Test-Path $d -PathType Container)) { throw "missing internal folder: $d (check contents_directory in the .spec files)" }
          }
          Write-Host "Internal folders present: OK"

      - name: Verify supervisor and host are thin
        shell: pwsh
        run: |
          foreach ($int in 'dist-supervisor/VideoGrabber/VideoGrabber_internal','dist-host/VideoGrabberApp/VideoGrabberApp_internal') {
            if (-not (Test-Path $int -PathType Container)) { throw "internal folder missing: $int" }
            foreach ($n in 'numpy','numpy.libs','PIL','pillow.libs','PySide6','yt_dlp') {
              if (Test-Path "$int/$n") { throw "$int bundles $n; it must only live in runtime\site-packages" }
            }
          }
          Write-Host "Supervisor and host are thin: OK"

      - name: Install runtime dependencies
        run: pip install --upgrade -r requirements.txt --target "staging\video 3 grabber\runtime\site-packages"

      - name: Verify numpy and Pillow in runtime
        shell: pwsh
        run: |
          $sp = (Resolve-Path 'staging/video 3 grabber/runtime/site-packages').Path
          foreach ($n in 'numpy','PIL') {
            if (-not (Test-Path "$sp/$n")) { throw "$n missing from runtime\site-packages" }
          }
          if (-not (Test-Path "$sp/numpy.libs")) { Write-Warning "numpy.libs not present" }
          @'
          import sys, os
          sp = sys.argv[1]
          sys.path.insert(0, sp)
          for d in (sp, os.path.join(sp, "numpy.libs"), os.path.join(sp, "pillow.libs")):
              if os.path.isdir(d):
                  os.add_dll_directory(d)
          import numpy, PIL
          from PIL import Image
          assert os.path.normcase(numpy.__file__).startswith(os.path.normcase(sp)), numpy.__file__
          assert os.path.normcase(PIL.__file__).startswith(os.path.normcase(sp)), PIL.__file__
          print("numpy", numpy.__version__, "| PIL", PIL.__version__)
          '@ | Set-Content -Path smoke_runtime.py -Encoding utf8
          python -I -S smoke_runtime.py "$sp"
          if ($LASTEXITCODE -ne 0) { throw "numpy/PIL import failed" }

      - name: Assemble split layout
        shell: pwsh
        run: |
          $root = 'staging/video 3 grabber'
          New-Item -ItemType Directory -Force "$root/app" | Out-Null
          Get-ChildItem -Filter *.py | Where-Object {
            $_.Name -notin 'launcher.py','app_host.py','recovery_ui.py'
          } | Copy-Item -Destination "$root/app/"
          if (-not (Test-Path "$root/app/vg_state.py")) { throw "app/vg_state.py missing" }
          Copy-Item -Path updater.bat, restore.bat -Destination "$root/"
          Set-Content "$root/install-version.txt" "v${env:GITHUB_RUN_NUMBER}" -NoNewline
          Copy-Item -Path 'dist-supervisor/VideoGrabber/VideoGrabber.exe' -Destination "$root/VideoGrabber.exe"
          Copy-Item -Path 'dist-supervisor/VideoGrabber/VideoGrabber_internal' -Destination "$root/" -Recurse
          Copy-Item -Path 'dist-host/VideoGrabberApp/VideoGrabberApp.exe' -Destination "$root/VideoGrabberApp.exe"
          Copy-Item -Path 'dist-host/VideoGrabberApp/VideoGrabberApp_internal' -Destination "$root/" -Recurse
          Copy-Item -Path 'dist-recovery/recovery' -Destination "$root/recovery" -Recurse
          Copy-Item -Path ffmpeg.exe, ffprobe.exe, deno.exe -Destination "$root/runtime/"

      - name: Generate app manifest.json
        shell: pwsh
        run: |
          @'
          import hashlib, json, pathlib
          app = pathlib.Path('staging/video 3 grabber/app')
          files = {}
          for p in sorted(app.rglob('*')):
              if not p.is_file(): continue
              rel = p.relative_to(app)
              if '__pycache__' in rel.parts or p.suffix == '.pyc' or p.name == 'manifest.json': continue
              h = hashlib.sha256()
              with open(p, 'rb') as f:
                  for chunk in iter(lambda: f.read(65536), b''): h.update(chunk)
              files[rel.as_posix()] = {'sha256': h.hexdigest(), 'size': p.stat().st_size}
          (app / 'manifest.json').write_text(json.dumps({'schema_version': 1, 'files': files}, indent=1), encoding='utf-8')
          '@ | Set-Content -Path gen_manifest.py -Encoding utf8
          python gen_manifest.py

      - name: "Package setup zip"
        shell: pwsh
        run: Compress-Archive -Path 'staging/video 3 grabber' -DestinationPath "VideoGrabber-setup-v${env:GITHUB_RUN_NUMBER}.zip" -Force

      - name: Package runtime-only zip
        shell: pwsh
        run: Compress-Archive -Path 'staging/video 3 grabber/runtime' -DestinationPath "VideoGrabber-runtime-v${env:GITHUB_RUN_NUMBER}.zip" -Force

      - name: Package app-only update zip
        shell: pwsh
        run: |
          $appRoot = 'staging-app/video 3 grabber'
          New-Item -ItemType Directory -Force "$appRoot/app" | Out-Null
          Copy-Item -Path 'staging/video 3 grabber/app/*' -Destination "$appRoot/app/" -Recurse
          Copy-Item -Path 'dist-host/VideoGrabberApp/VideoGrabberApp.exe' -Destination "$appRoot/VideoGrabberApp.exe"
          Copy-Item -Path 'dist-host/VideoGrabberApp/VideoGrabberApp_internal' -Destination "$appRoot/" -Recurse
          Copy-Item -Path 'staging/video 3 grabber/updater.bat','staging/video 3 grabber/restore.bat' -Destination "$appRoot/"
          Compress-Archive -Path "$appRoot" -DestinationPath "VideoGrabber-app-v${env:GITHUB_RUN_NUMBER}.zip" -Force

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $lines = foreach ($z in "VideoGrabber-setup-v${env:GITHUB_RUN_NUMBER}.zip","VideoGrabber-app-v${env:GITHUB_RUN_NUMBER}.zip","VideoGrabber-runtime-v${env:GITHUB_RUN_NUMBER}.zip") {
            $h = (Get-FileHash $z -Algorithm SHA256).Hash.ToLower()
            "$h  $z"
          }
          $lines | Set-Content -Path "SHA256SUMS-v${env:GITHUB_RUN_NUMBER}.txt" -Encoding ascii

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Build ${{ github.run_number }}"
          body: |
            Automatic build from commit ${{ github.sha }}.
            ${{ github.event.head_commit.message }}
          files: |
            backend/VideoGrabber-setup-v${{ github.run_number }}.zip
            backend/VideoGrabber-app-v${{ github.run_number }}.zip
            backend/VideoGrabber-runtime-v${{ github.run_number }}.zip
            backend/SHA256SUMS-v${{ github.run_number }}.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    needs: build
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}   # FIX: tells gh which repo to query
    steps:
      - name: Fetch setup zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download "v${env:GITHUB_RUN_NUMBER}" --pattern "VideoGrabber-setup-*.zip" --dir dl
          Expand-Archive -Path (Get-ChildItem dl/*.zip | Select-Object -First 1).FullName -DestinationPath install-test
          $root = (Resolve-Path 'install-test/video 3 grabber').Path
          "VG_ROOT=$root" | Out-File $env:GITHUB_ENV -Append
          $scratch = Join-Path $env:RUNNER_TEMP 'vg-localappdata'
          New-Item -ItemType Directory -Force $scratch | Out-Null
          "LOCALAPPDATA=$scratch" | Out-File $env:GITHUB_ENV -Append

      - name: "(a) crash x3 -> Recovery"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:VG_ROOT 'VideoGrabber.exe'
          $tag = "v${env:GITHUB_RUN_NUMBER}"
          foreach ($i in 1..3) {
            $p = Start-Process $exe -ArgumentList '--simulate=crash-before-sentinel' -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; throw "run $i hung" }
          }
          $statePath = Join-Path $env:LOCALAPPDATA 'VideoGrabber/recovery_state.json'
          $state = Get-Content $statePath -Raw | ConvertFrom-Json
          if ($state.crash_count -lt 3) { throw "crash_count $($state.crash_count)" }
          if ($state.blacklist -notcontains $tag) { throw "blacklist missing $tag" }
          $rec = Get-Process recovery -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $rec) { throw "Recovery did not open" }
          Stop-Process -Id $rec.Id -Force
          Remove-Item (Join-Path $env:LOCALAPPDATA 'VideoGrabber') -Recurse -Force

      - name: "(b) bat swap + rollback"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scratch = Join-Path $env:RUNNER_TEMP 'vg swap test'
          Copy-Item $env:VG_ROOT $scratch -Recurse
          $pkg = Join-Path $env:RUNNER_TEMP 'vg pkg test'
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item (Join-Path $scratch 'app') $pkg -Recurse
          Copy-Item (Join-Path $scratch 'VideoGrabberApp.exe') $pkg
          Copy-Item (Join-Path $scratch 'VideoGrabberApp_internal') $pkg -Recurse
          Add-Content (Join-Path $pkg 'app/server.py') "`n# swap-marker-b"
          $bat = Join-Path $scratch 'updater.bat'
          $runner = Join-Path $env:RUNNER_TEMP 'run-updater.cmd'
          Set-Content $runner ('call "{0}" "{1}" "{2}" "vTEST"' -f $bat, $scratch, $pkg)
          & $runner
          if ($LASTEXITCODE -ne 0) { throw "full swap exited $LASTEXITCODE" }
          if (-not (Select-String -Path (Join-Path $scratch 'app/server.py') -Pattern 'swap-marker-b' -Quiet)) { throw "full swap failed" }
          & (Join-Path $scratch 'restore.bat') $scratch
          if (Select-String -Path (Join-Path $scratch 'app/server.py') -Pattern 'swap-marker-b' -Quiet) { throw "rollback failed" }
          Start-Sleep -Seconds 3
          Get-Process VideoGrabber, VideoGrabberApp -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          Remove-Item (Join-Path $env:LOCALAPPDATA 'VideoGrabber') -Recurse -Force -ErrorAction SilentlyContinue
          
          $hostPkg = Join-Path $env:RUNNER_TEMP 'vg host pkg'
          New-Item -ItemType Directory -Force $hostPkg | Out-Null
          Copy-Item (Join-Path $scratch 'VideoGrabberApp.exe') $hostPkg
          Copy-Item (Join-Path $scratch 'VideoGrabberApp_internal') $hostPkg -Recurse
          Set-Content (Join-Path $hostPkg 'VideoGrabberApp_internal/host-marker.txt') 'host-marker-b'
          Set-Content $runner ('call "{0}" "{1}" "{2}" "vTESTHOST" "host"' -f $bat, $scratch, $hostPkg)
          & $runner
          if ($LASTEXITCODE -ne 0) { throw "host mode exited $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $scratch 'VideoGrabberApp_internal/host-marker.txt'))) { throw "host mode failed" }

      - name: "(c) duplicate host refused"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostExe = Join-Path $env:VG_ROOT 'VideoGrabberApp.exe'
          $first = Start-Process $hostExe -PassThru
          Start-Sleep -Seconds 8
          $second = Start-Process $hostExe -PassThru
          if (-not $second.WaitForExit(15000)) { Stop-Process -Id $second.Id -Force; throw "second host not refused" }
          Stop-Process -Id $first.Id -Force -ErrorAction SilentlyContinue

      - name: "(d) kill supervisor kills host"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:VG_ROOT 'VideoGrabber.exe'
          $sup = Start-Process $exe -PassThru
          $hostProc = $null
          foreach ($i in 1..30) {
            $hostProc = Get-Process VideoGrabberApp -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hostProc) { break }
            Start-Sleep -Seconds 1
          }
          if (-not $hostProc) { throw "no host spawned" }
          Stop-Process -Id $sup.Id -Force
          foreach ($i in 1..15) {
            if (-not (Get-Process -Id $hostProc.Id -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Seconds 1
          }
          if (Get-Process -Id $hostProc.Id -ErrorAction SilentlyContinue) { Stop-Process -Id $hostProc.Id -Force; throw "host survived supervisor" }

  publish:
    needs: [build, integration]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Promote the release
        run: gh release edit "v${{ github.run_number }}" --repo "${{ github.repository }}" --prerelease=false