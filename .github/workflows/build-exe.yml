name: Build VideoGrabber.exe

on:
  workflow_dispatch:      # manual "Run workflow" button on GitHub
  push:
    paths:
      - "backend/**"
      - ".github/workflows/build-exe.yml"

# Required so the release step can create a release in this repo.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Pinned instead of tracking releases/latest, for reproducible builds
      # (QUESTIONS.md #3 / BUGS.md #6). Bump this deliberately when you want
      # a newer Deno — e.g. for a YouTube signature-challenge fix — rather
      # than getting whatever's newest on an unrelated push.
      DENO_VERSION: "2.9.6"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and bundle ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted
          $ffmpegExe = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination .\ffmpeg.exe
          $ffprobeExe = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ffprobeExe.FullName -Destination .\ffprobe.exe

      - name: Download and bundle Deno
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/download/v${env:DENO_VERSION}/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
          Expand-Archive "deno.zip" -DestinationPath "_deno" -Force
          Copy-Item "_deno\deno.exe" "deno.exe"

      - name: Build exe
        run: |
          # --onedir instead of --onefile: onefile re-extracts the entire bundle
          # (PySide6 DLLs, ffmpeg, yt-dlp, Tcl libs) to a temp folder on EVERY
          # launch, costing 30s-minutes. onedir starts instantly.
          pyinstaller --onedir --noconsole --name VideoGrabber --icon=VideoGrabber.ico --collect-all yt_dlp --collect-all PySide6 --collect-all streamlink --collect-all watchdog --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." --add-binary "deno.exe;." server.py

      # onedir output is a FOLDER: dist/VideoGrabber/VideoGrabber.exe plus
      # all its DLLs/assets alongside it. Zip the whole folder so the release
      # download is a single file the user extracts.
      - name: Package as zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/VideoGrabber/*" -DestinationPath "VideoGrabber-windows.zip" -Force

      # Releases don't count against the Actions artifact storage quota
      # (which was the source of the "Artifact storage quota has been hit"
      # failures). Each build becomes a permanent release tagged vN, and the
      # exe is attached to it — downloadable forever from the Releases page.
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Build ${{ github.run_number }}"
          body: |
            Automatic build from commit ${{ github.sha }}.

            ${{ github.event.head_commit.message }}
          files: backend/VideoGrabber-windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}